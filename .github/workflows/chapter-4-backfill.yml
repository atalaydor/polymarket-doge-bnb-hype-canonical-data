name: Chapter 4 finite public backfill

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Bounded operation to execute
        required: true
        type: choice
        options:
          - proof
          - canary
          - one-partition
          - recovery-canary
          - dry-plan
          - full-backfill
      partition:
        description: Exact asset/5m/YYYY-MM-DD partition (optional only for one-partition)
        required: false
        type: string

concurrency:
  group: chapter-4-ledger-reconciliation
  cancel-in-progress: false

permissions: {}

jobs:
  proof-or-plan:
    if: ${{ inputs.mode == 'proof' || inputs.mode == 'dry-plan' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # Draft dataset releases require push access even for read-only API inventory.
      contents: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - name: Record runner resources
        run: |
          python --version
          getconf _NPROCESSORS_ONLN
          free -b
          df -B1 .
      - name: Build, install, and verify configuration
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir build==1.2.2.post1
          python -m build
          python -m pip install --disable-pip-version-check --no-cache-dir .
          python -m json.tool config/pipeline.json >/dev/null
          python -m json.tool config/production-plan.json >/dev/null
      - name: Remote verify/no-op proof
        if: ${{ inputs.mode == 'proof' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/actions_backend.py proof
      - name: Finite unfinished plan
        if: ${{ inputs.mode == 'dry-plan' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/actions_backend.py plan

  plan:
    if: ${{ inputs.mode == 'full-backfill' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # The authoritative partition inventory is held in draft dataset releases.
      contents: write
    outputs:
      matrix_0: ${{ steps.plan.outputs.matrix_0 }}
      matrix_1: ${{ steps.plan.outputs.matrix_1 }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - run: python -m pip install --disable-pip-version-check --no-cache-dir .
      - id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/actions_backend.py plan

  one-partition:
    if: ${{ inputs.mode == 'one-partition' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          fetch-depth: 0
      - run: python -m pip install --disable-pip-version-check --no-cache-dir .
      - name: Execute or verify/no-op one partition
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PARTITION: ${{ inputs.partition }}
        run: python scripts/actions_backend.py execute --partition "$PARTITION"
      - name: Serialize aggregate ledger checkpoint
        run: |
          if git diff --quiet -- config/backfill-ledger.json; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config/backfill-ledger.json
          git commit -m "Chapter 4 checkpoint - Actions partition"
          git push origin HEAD:main

  canary:
    if: ${{ inputs.mode == 'canary' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          fetch-depth: 0
      - run: python -m pip install --disable-pip-version-check --no-cache-dir .
      - name: Execute deterministic representative canary and no-op reruns
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/actions_backend.py canary
      - name: Serialize aggregate ledger checkpoint
        run: |
          if git diff --quiet -- config/backfill-ledger.json; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config/backfill-ledger.json
          git commit -m "Chapter 4 checkpoint - representative canary"
          git push origin HEAD:main

  recovery-verify:
    if: ${{ inputs.mode == 'recovery-canary' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {}
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - run: |
          python -m pip install --disable-pip-version-check --no-cache-dir .
          python -m pip install --disable-pip-version-check --no-cache-dir ruff==0.12.12 mypy==1.17.1
      - run: python -m unittest discover -s tests -v
      - run: ruff check .
      - run: mypy
      - run: git diff --check

  recovery-day:
    if: ${{ inputs.mode == 'recovery-canary' }}
    needs: recovery-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        day:
          - "2026-06-09"
          - "2026-06-10"
          - "2026-06-11"
          - "2026-07-29"
          - "2026-08-05"
          - "2026-08-07"
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          fetch-depth: 0
      - run: python -m pip install --disable-pip-version-check --no-cache-dir .
      - run: git pull --ff-only origin main
      - name: Recover exact unfinished same-day asset batch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/actions_backend.py execute-day --day "${{ matrix.day }}"
      - name: Serialize aggregate recovery checkpoint
        run: |
          if git diff --quiet -- config/backfill-ledger.json; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config/backfill-ledger.json
          git commit -m "Chapter 4 checkpoint - bounded recovery"
          git push origin HEAD:main

  certify-recovery:
    if: ${{ inputs.mode == 'recovery-canary' }}
    needs: recovery-day
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          fetch-depth: 0
      - run: python -m pip install --disable-pip-version-check --no-cache-dir .
      - run: git pull --ff-only origin main
      - name: Reconcile and certify all 375 durable partitions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/actions_backend.py certify
      - name: Commit certification checkpoint and immutable Chapter 4 tag
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config/backfill-ledger.json docs/chapter-4-certification.json
          git commit -m "Chapter 4 complete - certified"
          git tag -a chapter-4-certified-v1 -m "Chapter 4 complete - 375 durable partitions"
          git push origin HEAD:main
          git push origin refs/tags/chapter-4-certified-v1

  stage-0:
    if: ${{ inputs.mode == 'full-backfill' && needs.plan.outputs.matrix_0 != '{"include":[]}' }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix_0) }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          fetch-depth: 0
      - run: python -m pip install --disable-pip-version-check --no-cache-dir .
      - run: git pull --ff-only origin main
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/actions_backend.py execute-day --day "${{ matrix.day }}"
      - name: Serialize aggregate ledger checkpoint
        run: |
          if git diff --quiet -- config/backfill-ledger.json; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config/backfill-ledger.json
          git commit -m "Chapter 4 checkpoint - Actions partition"
          git push origin HEAD:main

  stage-1:
    if: ${{ inputs.mode == 'full-backfill' && needs.plan.outputs.matrix_1 != '{"include":[]}' }}
    needs: [plan, stage-0]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix_1) }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          fetch-depth: 0
      - run: python -m pip install --disable-pip-version-check --no-cache-dir .
      - run: git pull --ff-only origin main
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/actions_backend.py execute-day --day "${{ matrix.day }}"
      - name: Serialize aggregate ledger checkpoint
        run: |
          if git diff --quiet -- config/backfill-ledger.json; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config/backfill-ledger.json
          git commit -m "Chapter 4 checkpoint - Actions partition"
          git push origin HEAD:main
